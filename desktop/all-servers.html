<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'">
<title>Fabric Inbox</title>
<link rel="stylesheet" href="fabric-tokens.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="all-servers.css">
<script src="all-servers.js" defer></script>
</head>
<!-- B-233 (SCN-099). Every word is written by all-servers.js through its dictionary. -->
<body>
<main class="all">
  <p class="eyebrow"><img src="inbox-mark.svg" alt="">Fabric Inbox</p>
  <h1 id="title" tabindex="-1"></h1>
  <div class="bar">
    <label for="server" id="server-label"></label>
    <select id="server"></select>
    <label class="check"><input type="checkbox" id="unread"><span id="unread-label"></span></label>
    <button type="button" id="refresh" class="secondary"></button>
  </div>
  <ul id="servers" class="servers"></ul>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <ol id="list" class="list" aria-live="polite"></ol>
</main>
</body>
</html>
