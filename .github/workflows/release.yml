# The release: the Developer ID disk image, signed with the organization's CI Developer ID,
# notarized and stapled (app first, then the image made from the stapled app); then attested
# (Sigstore), summed and GPG-signed, and published. Beside it, the Mac App Store package, signed
# with the CI-only store identities and uploaded to App Store Connect when the release publishes.
# Signing happens only here, in the protected `release` environment: approved by a
# person from release-approvers, who may be whoever pushed the tag; an agent never
# approves (passioncode-ai/.github release-signing/README.md). A published release is never rewritten: a fix is a new tag.
#
# Release:    push an annotated vX.Y.Z tag on the reviewed release commit.
# Rehearsal:  push vX.Y.Z-rc.N (the push trigger ignores it), then
#             gh workflow run release.yml --ref vX.Y.Z-rc.N -f publish=false
#             The signed set and the store package are kept as workflow artifacts; no release is
#             created and nothing is uploaded to App Store Connect.
# Procedure and what each job proves: docs/release.md.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish:
        description: "false = rehearsal: sign, notarize and attest, create no release, upload nothing to the App Store"
        type: boolean
        default: false

permissions:
  contents: read

# Two runs for one tag would race for the same release and the same store build number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Not signing, so it needs no approval: the repository's gate on the tagged commit, and the
  # version and store build number the signing jobs use.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: The tag names the version every manifest carries
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$REF_TYPE" == tag ]] || { echo "::error::Run the release on a tag (vX.Y.Z or vX.Y.Z-rc.N), not on $REF_TYPE $TAG."; exit 1; }
          version=$(node -p 'require("./desktop/package.json").version')
          build=$(node scripts/app-store-connect.mjs build-number "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build-number=$build" >> "$GITHUB_OUTPUT"
          echo "Fabric Inbox $version from $TAG; Mac App Store build number $build."
      - run: npm ci
      - name: Tests (Worker code in workerd, no network)
        run: npm test
      - name: Types
        run: npm run typecheck

  macos:
    needs: gate
    runs-on: macos-latest
    environment: release
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (uvx runs dmgbuild for the image's Finder layout)
      - run: npm ci
      - id: sign
        uses: passioncode-ai/.github/actions/apple-signing@v1
        with:
          developer-id-p12-b64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          team-id: ${{ vars.APPLE_TEAM_ID }}
      - name: Build the app, signed with the Developer ID
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          # Anonymous usage counts (docs/ANALYTICS.md): only this build carries the App Key.
          FABRIC_INBOX_ANALYTICS_APP_KEY: ${{ secrets.FABRIC_INBOX_ANALYTICS_APP_KEY }}
          FABRIC_INBOX_ANALYTICS_HOST: ${{ vars.FABRIC_INBOX_ANALYTICS_HOST }}
        run: node desktop/dist-mac.mjs --stage app --identity "$IDENTITY"
      - id: notarize-app
        uses: passioncode-ai/.github/actions/notarize@v1
        with:
          path: release/ci/Fabric Inbox.app
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-p8-b64: ${{ secrets.ASC_API_KEY_P8_B64 }}
      - name: The disk image, from the stapled app, signed
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          SUBMISSION: ${{ steps.notarize-app.outputs.submission }}
        run: node desktop/dist-mac.mjs --stage image --identity "$IDENTITY" --submission "$SUBMISSION"
      - id: notarize-image
        uses: passioncode-ai/.github/actions/notarize@v1
        with:
          path: release/Fabric-Inbox-${{ needs.gate.outputs.version }}.dmg
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-p8-b64: ${{ secrets.ASC_API_KEY_P8_B64 }}
      - name: Assess the image, write the receipt
        env:
          SUBMISSION: ${{ steps.notarize-image.outputs.submission }}
        run: node desktop/dist-mac.mjs --stage finish --submission "$SUBMISSION"
      # The receipt ships beside the image; the `.sha256` does not: release-publish's GPG-signed
      # SHA256SUMS covers every file of the release. The `-mac.zip` and `update-mac.json` are the
      # automatic update every released copy reads at releases/latest/download/update-mac.json.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}.dmg
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}.receipt.json
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}-mac.zip
            release/update-mac.json
          if-no-files-found: error
      - if: always()
        uses: passioncode-ai/.github/actions/apple-signing/cleanup@v1

  # The Mac App Store package. It is not a release file (only the store installs it), so its
  # artifact is not named release-*; it is uploaded to App Store Connect only when publishing.
  mas:
    needs: gate
    runs-on: macos-latest
    environment: release
    timeout-minutes: 120
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      BUILD_NUMBER: ${{ needs.gate.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: The App Store Connect app record exists (required to publish; a rehearsal only reports it)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          if [[ "$PUBLISH" == true ]]; then node scripts/app-store-connect.mjs check-record
          else node scripts/app-store-connect.mjs check-record --warn-only; fi
      - run: npm ci
      - id: sign
        uses: passioncode-ai/.github/actions/apple-signing@v1
        with:
          developer-id-p12-b64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          team-id: ${{ vars.APPLE_TEAM_ID }}
          distribution-p12-b64: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
          installer-p12-b64: ${{ secrets.APPLE_INSTALLER_P12_B64 }}
          mas-p12-password: ${{ secrets.APPLE_MAS_P12_PASSWORD }}
      - name: The provisioning profile, outside the repository
        env:
          MAS_PROVISION_PROFILE_B64: ${{ secrets.MAS_PROVISION_PROFILE_B64 }}
        run: |
          [[ -n "$MAS_PROVISION_PROFILE_B64" ]] || { echo "::error::MAS_PROVISION_PROFILE_B64 is empty; is the release environment's secret set?"; exit 1; }
          ( umask 077; printf '%s' "$MAS_PROVISION_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/fabric-inbox.provisionprofile" )
      - name: Build the store package, signed with the Mac App Store identities
        id: build
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          APP_IDENTITY: ${{ steps.sign.outputs.mas-app-identity }}
          INSTALLER_IDENTITY: ${{ steps.sign.outputs.mas-installer-identity }}
          REVISION: ${{ github.sha }}
        run: |
          node desktop/mas-package.mjs --mode distribution --arch arm64 --team "$TEAM" \
            --identity "$APP_IDENTITY" --installer-identity "$INSTALLER_IDENTITY" \
            --profile "$RUNNER_TEMP/fabric-inbox.provisionprofile" \
            --build-number "$BUILD_NUMBER" --revision "$REVISION" --build
          out="release/mas-distribution-arm64-$BUILD_NUMBER-${REVISION:0:12}"
          [[ -f "$out/Fabric Inbox.pkg" ]] || { echo "::error::no package at $out/Fabric Inbox.pkg"; exit 1; }
          echo "dir=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mas-pkg-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.build-number }}
          path: |
            ${{ steps.build.outputs.dir }}/Fabric Inbox.pkg
            ${{ steps.build.outputs.dir }}/build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload to App Store Connect
        if: ${{ env.PUBLISH == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          PKG_DIR: ${{ steps.build.outputs.dir }}
        run: node scripts/app-store-connect.mjs upload "$PKG_DIR/Fabric Inbox.pkg"
      - if: always()
        run: rm -f "$RUNNER_TEMP/fabric-inbox.provisionprofile"
      - if: always()
        uses: passioncode-ai/.github/actions/apple-signing/cleanup@v1

  # Windows (fabric-workspace knowledge/platforms.md PL-01, PL-02): the per-user NSIS installer for
  # each architecture, both built on x64 (workerd has no Windows ARM64 binary; electron-builder
  # cross-builds the arm64 one). Authenticode is Azure Artifact Signing over OIDC, switched on by the
  # release environment's AZURE_SIGNING_ENABLED once the organization's identity validation is done;
  # until then the installer is unsigned, its receipt says windows_authenticode: NOT_SIGNED, and the
  # release notes say so (docs/release.md). The update feed (update-win32-<arch>.json) is checked
  # here, before signing, by the app's own verifier.
  windows:
    needs: gate
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # azure/login (OIDC), used only when Windows signing is switched on
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      SIGNING: ${{ vars.AZURE_SIGNING_ENABLED == 'true' }}
      FABRIC_INBOX_RELEASE_BUILD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Azure login (OIDC)
        if: env.SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build the installer (signed with Artifact Signing when it is switched on)
        env:
          AZURE_SIGNING_ENDPOINT: ${{ env.SIGNING == 'true' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ env.SIGNING == 'true' && vars.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ env.SIGNING == 'true' && vars.AZURE_CERTIFICATE_PROFILE || '' }}
          FABRIC_INBOX_ANALYTICS_APP_KEY: ${{ secrets.FABRIC_INBOX_ANALYTICS_APP_KEY }}
          FABRIC_INBOX_ANALYTICS_HOST: ${{ vars.FABRIC_INBOX_ANALYTICS_HOST }}
        run: node desktop/dist-platform.mjs --platform win32 --arch ${{ matrix.arch }} --out release
      - name: The built update passes the app's checks, before signing the release set
        run: |
          flags=(); [[ "$SIGNING" == true ]] && flags=(--require-authenticode)
          node scripts/check-update-release.mjs --before-signing --platform win32 --arch ${{ matrix.arch }} --dir release --version "$VERSION" --repository "$GITHUB_REPOSITORY" "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}-win-${{ matrix.arch }}-setup.exe
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}-win-${{ matrix.arch }}.receipt.json
            release/update-win32-${{ matrix.arch }}.json
          if-no-files-found: error

  # Linux (PL-03, PL-05): the AppImage (it updates itself from update-linux-<arch>.json) and the
  # .deb (apt-installed, never checks), each built on its own architecture. No signing beyond the
  # release set's GPG-signed SHA256SUMS, which is what an AppImage update verifies.
  linux:
    needs: gate
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      FABRIC_INBOX_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the AppImage and the .deb
        env:
          FABRIC_INBOX_ANALYTICS_APP_KEY: ${{ secrets.FABRIC_INBOX_ANALYTICS_APP_KEY }}
          FABRIC_INBOX_ANALYTICS_HOST: ${{ vars.FABRIC_INBOX_ANALYTICS_HOST }}
        run: node desktop/dist-platform.mjs --platform linux --arch ${{ matrix.arch }} --out release
      - name: The built update passes the app's checks, before signing the release set
        run: node scripts/check-update-release.mjs --before-signing --platform linux --arch ${{ matrix.arch }} --dir release --version "$VERSION" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}-linux-${{ matrix.arch }}.AppImage
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}-linux-${{ matrix.arch }}.deb
            release/Fabric-Inbox-${{ needs.gate.outputs.version }}-linux-${{ matrix.arch }}.receipt.json
            release/update-linux-${{ matrix.arch }}.json
          if-no-files-found: error

  # The update every installed copy will read, checked before anything is published (LC-16): the
  # built feed names this release's own zip, the zip has the feed's digest and size, and the app
  # inside is the pinned team's, of this version. The signature is checked again after publish.
  update-precheck:
    needs: [gate, macos]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos
          path: built
      - name: The built update passes the app's checks, before signing
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: node scripts/check-update-release.mjs --before-signing --dir built --version "$VERSION" --repository "$GITHUB_REPOSITORY"

  # The Developer ID release. The store job does not hold it: a store upload Apple refuses (for
  # example while the app record is missing) fails its own job and leaves the disk image released.
  publish:
    needs: [gate, macos, update-precheck, windows, linux]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: passioncode-ai/.github/.github/workflows/release-publish.yml@v1
    with:
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets: inherit

  # After publish, the signed set (LC-16): verified exactly as an installed copy
  # verifies an update — the GPG-signed SHA256SUMS lists the feed, the feed names only this release's
  # zip, the zip has the signed digest and size, and the app inside is the pinned team's, of this
  # version. A release that fails here would be refused by every copy; the run says so first.
  update-check:
    needs: [gate, publish]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # A rehearsal keeps the signed set as an artifact (files under dist/); a published release
      # holds the same files as its assets.
      - if: ${{ !(github.event_name == 'push' || inputs.publish) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ github.ref_name }}
          path: rehearsal
      - name: The signed release set
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ github.event_name == 'push' || inputs.publish }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D signed -p update-mac.json -p SHA256SUMS -p SHA256SUMS.asc -p '*-mac.zip'
          else
            mv rehearsal/dist signed
          fi
          ls -l signed
      - name: The update every installed copy will read passes the app's own verification
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: node scripts/check-update-release.mjs --dir signed --version "$VERSION" --repository "$GITHUB_REPOSITORY"

  # The same check for every Windows and Linux feed, on the OS that reads it: the GPG-signed
  # SHA256SUMS lists the feed, the feed names only this release's installer or AppImage with the
  # signed digest and size, and the file passes the platform's inspection (the installer's version
  # on Windows, and its Authenticode signature once signing is on; the AppImage format on Linux).
  update-check-platforms:
    needs: [gate, publish]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win32, files: "*-win-*-setup.exe" }
          - { runner: ubuntu-24.04, platform: linux, files: "*.AppImage" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: ${{ !(github.event_name == 'push' || inputs.publish) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ github.ref_name }}
          path: rehearsal
      - name: The signed release set
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ github.event_name == 'push' || inputs.publish }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          FILES: ${{ matrix.files }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D signed -p "update-$PLATFORM-*.json" -p SHA256SUMS -p SHA256SUMS.asc -p "$FILES"
          else
            mv rehearsal/dist signed
          fi
          ls -l signed
      - name: Every architecture's update passes the app's own verification
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SIGNING: ${{ vars.AZURE_SIGNING_ENABLED == 'true' }}
        run: |
          flags=(); [[ "$PLATFORM" == win32 && "$SIGNING" == true ]] && flags=(--require-authenticode)
          for arch in x64 arm64; do
            node scripts/check-update-release.mjs --platform "$PLATFORM" --arch "$arch" --dir signed --version "$VERSION" --repository "$GITHUB_REPOSITORY" "${flags[@]}"
          done
